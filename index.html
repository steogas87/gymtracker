// -- STATE --
function ls(k,d){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const ST={
  tab:ls('gt_tab','A'), w:ls('gt_w',{}), rat:ls('gt_rat',{}),
  chk:ls('gt_chk',{}), notes:ls('gt_notes',{}), names:ls('gt_names',{}),
};
function save(k){lsSet('gt_'+k,ST[k]);}
const E=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function allEx(t){return[...WK[t].ex,...WK[t].abs];}
function getName(ex){return ST.names[ex.id]!==undefined?ST.names[ex.id]:ex.name;}
function getW(ex){return ST.w[ex.id]!==undefined?ST.w[ex.id]:ex.w;}
function getRat(ex){return ST.rat[ex.id]!==undefined?ST.rat[ex.id]:null;}
function getNote(ex){return ST.notes[ex.id]!==undefined?ST.notes[ex.id]:ex.note;}
function getEx(id){return allEx(ST.tab).find(e=>e.id===id);}

// -- STORICO --
function saveSession(){
  const t=ST.tab,all=allEx(t),done=all.filter(e=>ST.chk[e.id]).length;
  if(!done)return;
  const hist=ls('gt_hist',[]);
  const entry={
    date:new Date().toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}),
    ts:Date.now(),tab:t,done,total:all.length,weights:{}
  };
  all.forEach(ex=>{if(ST.w[ex.id])entry.weights[getName(ex)]=ST.w[ex.id];});
  hist.unshift(entry);
  if(hist.length>30)hist.length=30;
  lsSet('gt_hist',hist);
}

// -- BACKUP / RIPRISTINO --
function exportData(){
  const data={_app:'gymtracker',_v:1,_exportedAt:new Date().toISOString()};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('gt_')===0)data[k]=localStorage.getItem(k);}
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  a.href=url;a.download='gymtracker-backup-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        const keys=Object.keys(data).filter(k=>k.indexOf('gt_')===0);
        if(!keys.length){alert('File non valido: nessun dato GymTracker trovato.');return;}
        if(!confirm('Ripristinare questo backup? I dati attuali verranno sostituiti.'))return;
        keys.forEach(k=>localStorage.setItem(k,typeof data[k]==='string'?data[k]:JSON.stringify(data[k])));
        alert('Backup ripristinato! Ora l\'app si ricarica.');location.reload();
      }catch(e){alert('File non leggibile o danneggiato.');}
    };
    r.readAsText(f);
  };
  inp.click();
}

    const[bg,brd,clr]=RS[v],act=(rat===parseInt(v));
    return`<button class="btn-rat" data-id="${E(ex.id)}" data-v="${v}"
      style="padding:4px 10px;border-radius:99px;font-weight:800;font-size:13px;line-height:1;
        border:1.5px solid ${act?brd:'#ddd'};background:${act?bg:'white'};color:${act?clr:'#bbb'}" title="${RLONG[v]}">${RLBL[v]}</button>`;
  }).join('');
  return`<div style="background:${chk?'#ebebeb':'white'};border-radius:14px;margin-bottom:8px;
    border:1.5px solid ${chk?'#ddd':col.badge};overflow:hidden;opacity:${chk?.6:1};
    box-shadow:${chk?'none':'0 1px 4px rgba(0,0,0,.06)'}">
    <div style="display:flex;align-items:center;padding:11px 12px;gap:10px">
      <button class="btn-chk" data-id="${E(ex.id)}"
        style="width:28px;height:28px;border-radius:8px;flex-shrink:0;
          border:2px solid ${chk?col.main:'#ccc'};background:${chk?col.main:'white'};
          display:flex;align-items:center;justify-content:center;font-size:15px;color:white;font-weight:900">
        ${chk?'&#10003;':''}
      </button>
      <div style="flex:1;min-width:0">
        <div class="nm" data-id="${E(ex.id)}"
          style="font-size:14px;font-weight:700;cursor:text;line-height:1.3;font-family:Georgia,serif;
            color:${chk?'#999':'#1a1a1a'};text-decoration:${chk?'line-through':'none'}">${E(name)}</div>
      </div>
      <button class="btn-info" data-id="${E(ex.id)}"
        style="width:30px;height:30px;border-radius:50%;flex-shrink:0;
          background:${col.light};border:1.5px solid ${col.badge};color:${col.main};font-size:14px;font-weight:800;
          display:flex;align-items:center;justify-content:center">i</button>
    </div>
    <div style="padding:0 12px 8px 50px">
      <div class="nt" data-id="${E(ex.id)}" style="display:flex;align-items:flex-start;gap:6px;cursor:text">
        <span style="font-size:11px;color:#bbb;margin-top:1px">&#9999;</span>
        <span style="font-size:11px;color:#999;font-style:italic;line-height:1.5;flex:1">${E(note)||'Aggiungi nota...'}</span>
      </div>
    </div>
    <div style="background:${col.light};padding:8px 12px;border-top:1px solid ${col.badge};
      display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span style="background:${col.main};color:white;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:700">${ex.s}x${ex.r}</span>
      <span style="background:white;color:${col.text};border-radius:6px;padding:3px 8px;font-size:11px;border:1px solid ${col.badge};font-family:monospace">rec ${ex.rec}</span>
      ${!isAbs?`<div style="margin-left:auto;display:flex;align-items:center;gap:5px">
        <span style="font-size:10px;color:${col.text};font-weight:600">kg</span>
        <input class="inp-w" data-id="${E(ex.id)}" value="${E(wt)}"
          style="width:86px;padding:4px 6px;border-radius:8px;text-align:center;border:2px solid ${col.main};
            font-size:13px;font-weight:800;color:${col.text};background:white;font-family:monospace" placeholder="-">
      </div>`:''}
    </div>
    <div style="background:#fafafa;padding:7px 12px;border-top:1px solid #eee;
      display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span style="font-size:10px;color:#aaa;font-weight:700;letter-spacing:1px;text-transform:uppercase">Prossima volta</span>
      <div style="display:flex;gap:3px">${ratBtns}</div>
    </div>
  </div>`;}

// -- MODAL INFO --
function showModal(id){
  const ex=getEx(id);if(!ex)return;
  const col=COL[ST.tab],inf=INFO[id]||{},name=getName(ex);
  const ytQ=encodeURIComponent(name+' come si fa esercizio palestra');
  const pills=(arr,bg,tc,brd)=>arr.map(m=>`<span style="background:${bg};color:${tc};border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;border:1px solid ${brd||bg}">${E(m)}</span>`).join(' ');
  const steps=arr=>(arr||[]).map((s,i)=>`<div style="display:flex;gap:12px;margin-bottom:10px;align-items:flex-start">
    <div style="width:24px;height:24px;border-radius:50%;background:${col.main};color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0">${i+1}</div>
    <div style="font-size:13px;color:#333;line-height:1.6;padding-top:2px">${E(s)}</div></div>`).join('');
  const errs=arr=>(arr||[]).map(e=>`<div style="display:flex;gap:10px;margin-bottom:7px;padding:9px 12px;background:#FFFBEB;border-radius:10px;border:1px solid #FDE68A">
    <span>!</span><div style="font-size:13px;color:#555;line-height:1.5">${E(e)}</div></div>`).join('');
  document.getElementById('modal-root').innerHTML=`
<div id="moverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;justify-content:center">
  <div style="background:white;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding-bottom:40px">
    <div style="display:flex;justify-content:center;padding:14px 0 0"><div style="width:44px;height:4px;border-radius:99px;background:#ddd"></div></div>
    <div style="padding:14px 20px;border-bottom:2px solid ${col.light};display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div>
        <div style="font-size:21px;font-weight:900;color:${col.main};font-family:Georgia,serif">${E(name)}</div>
        <div style="font-size:11px;color:#999;margin-top:3px;font-family:monospace">${ex.s} serie - ${ex.r} reps - rec ${ex.rec}</div>
      </div>
      <button id="btn-mclose" style="width:34px;height:34px;border-radius:50%;background:#f0f0f0;border:none;font-size:18px;color:#666">&#10005;</button>
    </div>
    <div style="padding:16px 20px">
      ${inf.p?`<div style="margin-bottom:18px">
        <div style="font-size:13px;font-weight:800;color:${col.main};margin-bottom:9px">Muscoli</div>
        <div style="margin-bottom:8px"><div style="font-size:10px;color:#888;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px">Primari</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">${pills(inf.p,col.main,'white',col.main)}</div></div>
        ${inf.sc&&inf.sc.length?`<div><div style="font-size:10px;color:#888;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px">Secondari</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">${pills(inf.sc,col.light,col.text,col.badge)}</div></div>`:''}
      </div>`:''}
      ${inf.t?`<div style="margin-bottom:18px"><div style="font-size:13px;font-weight:800;color:${col.main};margin-bottom:9px">Come si fa</div>${steps(inf.t)}</div>`:''}
      ${inf.e?`<div style="margin-bottom:18px"><div style="font-size:13px;font-weight:800;color:${col.main};margin-bottom:9px">Errori comuni</div>${errs(inf.e)}</div>`:''}
      ${inf.ten?`<div style="margin-bottom:18px"><div style="font-size:13px;font-weight:800;color:${col.main};margin-bottom:9px">Per il tennis</div>
        <div style="background:${col.light};border-radius:12px;padding:12px 14px;border:1.5px solid ${col.badge};font-size:13px;color:${col.text};line-height:1.6;font-style:italic">${E(inf.ten)}</div></div>`:''}
      <div style="display:flex;gap:8px;margin-top:4px">
        ${inf.d?`<div style="background:${col.light};border-radius:12px;padding:10px;border:1px solid ${col.badge};text-align:center;min-width:86px">
          <div style="font-size:9px;color:#888;font-weight:700;letter-spacing:1.5px;text-transform:uppercase">Difficolta'</div>
          <div style="font-size:14px;font-weight:800;color:${col.main};margin-top:2px">${E(inf.d)}</div></div>`:''}
        <a href="https://www.youtube.com/results?search_query=${ytQ}" target="_blank"
          style="flex:1;background:#cc0000;border-radius:12px;padding:10px 14px;text-decoration:none;color:white;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px">
          Cerca su YouTube</a>
      </div>
    </div>
  </div>
</div>`;
  document.getElementById('moverlay').addEventListener('click',e=>{if(e.target.id==='moverlay')closeModal();});
  document.getElementById('btn-mclose').addEventListener('click',closeModal);
}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

// -- STORICO MODAL --
function showHistoric(){
  const hist=ls('gt_hist',[]);
  const byTab={A:[],B:[],C:[]};
  hist.forEach(h=>{if(byTab[h.tab])byTab[h.tab].push(h);});
  const tabHtml=tab=>{
    const col=COL[tab],rows=byTab[tab];
    if(!rows.length)return`<div style="color:#bbb;font-style:italic;font-size:13px;padding:8px 0">Nessuna sessione registrata</div>`;
    return rows.map(r=>`<div style="background:${col.light};border-radius:10px;padding:10px 14px;margin-bottom:8px;border:1px solid ${col.badge}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-weight:800;font-size:13px;color:${col.main}">${r.date}</span>
        <span style="background:${col.main};color:white;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${r.done}/${r.total}</span>
      </div>
      ${Object.entries(r.weights||{}).map(([nm,w])=>`<div style="font-size:11px;color:${col.text};opacity:.8">- ${nm}: ${w} kg</div>`).join('')}
    </div>`).join('');
  };
  document.getElementById('modal-root').innerHTML=`
<div id="moverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;justify-content:center">
  <div style="background:white;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding-bottom:40px">
    <div style="display:flex;justify-content:center;padding:14px 0 0"><div style="width:44px;height:4px;border-radius:99px;background:#ddd"></div></div>
    <div style="padding:14px 20px;border-bottom:2px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:20px;font-weight:900;color:#1a1a1a">Storico Sessioni</div>
      <button id="btn-mclose" style="width:34px;height:34px;border-radius:50%;background:#f0f0f0;border:none;font-size:18px;color:#666">&#10005;</button>
    </div>
    <div style="padding:16px 20px">
      ${['A','B','C'].map(t=>`
        <div style="margin-bottom:20px">
          <div style="font-size:12px;font-weight:900;color:${COL[t].main};letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">
            <span style="background:${COL[t].main};color:white;border-radius:6px;padding:2px 8px;margin-right:8px">${t}</span>${WK[t].label}
          </div>
          ${tabHtml(t)}
        </div>`).join('')}
      ${hist.length?`<button id="btn-clear-hist" style="width:100%;padding:10px;border:1.5px solid #fca5a5;background:#fee2e2;border-radius:10px;color:#b91c1c;font-weight:700;font-size:13px;margin-top:8px">Cancella tutto lo storico</button>`:''}
    </div>
  </div>
</div>`;
  document.getElementById('moverlay').addEventListener('click',e=>{if(e.target.id==='moverlay')closeModal();});
  document.getElementById('btn-mclose').addEventListener('click',closeModal);
  const clr=document.getElementById('btn-clear-hist');
  if(clr)clr.addEventListener('click',()=>{lsSet('gt_hist',[]);closeModal();});
}

// -- INLINE EDITING --
function editName(el,id){
  const inp=document.createElement('input');
  inp.value=getName(getEx(id));
  const col=COL[ST.tab];
  inp.style.cssText=`width:100%;font-size:14px;font-weight:700;font-family:Georgia,serif;border:1.5px solid ${col.main};border-radius:8px;padding:3px 8px;background:${col.light};outline:none;box-sizing:border-box`;
  el.replaceWith(inp);inp.focus();inp.select();
  function done(){ST.names[id]=inp.value.trim()||getName(getEx(id));save('names');render();}
  inp.addEventListener('blur',done);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){inp.removeEventListener('blur',done);done();}});
}
function editNote(el,id){
  const ta=document.createElement('textarea');
  ta.value=getNote(getEx(id));ta.rows=2;
  const col=COL[ST.tab];
  ta.style.cssText=`width:100%;font-size:11px;color:#444;font-style:italic;line-height:1.5;border:1px solid ${col.badge};border-radius:8px;padding:5px 8px;resize:none;font-family:Georgia,serif;background:${col.light};outline:none;box-sizing:border-box`;
  el.replaceWith(ta);ta.focus();
  function done(){ST.notes[id]=ta.value;save('notes');render();}
  ta.addEventListener('blur',done);
}

// -- EVENTS --
document.addEventListener('click',function(e){
  const t=e.target;
  const tb=t.closest('.btn-tab');if(tb){ST.tab=tb.dataset.tab;save('tab');render();return;}
  if(t.id==='btn-reset'||t.closest('#btn-reset')){if(!confirm('Reset sessione '+ST.tab+'?'))return;saveSession();allEx(ST.tab).forEach(ex=>{delete ST.chk[ex.id];});save('chk');render();return;}
  if(t.id==='btn-hist'||t.closest('#btn-hist')){showHistoric();return;}
  if(t.id==='btn-backup'||t.closest('#btn-backup')){exportData();return;}
  if(t.id==='btn-restore'||t.closest('#btn-restore')){importData();return;}
  const cb=t.closest('.btn-chk');if(cb){const id=cb.dataset.id;ST.chk[id]=!ST.chk[id];save('chk');render();return;}
  const rb=t.closest('.btn-rat');if(rb){const{id,v}=rb.dataset;const n=parseInt(v);ST.rat[id]=(ST.rat[id]===n?null:n);save('rat');render();return;}
  const ib=t.closest('.btn-info');if(ib){showModal(ib.dataset.id);return;}
  if(t.id==='moverlay'){closeModal();return;}
  const nm=t.closest('.nm');if(nm){editName(nm,nm.dataset.id);return;}
  const nt=t.closest('.nt');if(nt){editNote(nt,nt.dataset.id);return;}
});
document.addEventListener('input',function(e){
  const inp=e.target.closest('.inp-w');
  if(inp){ST.w[inp.dataset.id]=inp.value;save('w');}
});

// -- PWA SERVICE WORKER --
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.log('SW:',e));
  });
}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install-banner').style.display='block';
});
document.getElementById('btn-install').addEventListener('click',()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('install-banner').style.display='none';});
});
document.getElementById('btn-dismiss').addEventListener('click',()=>{document.getElementById('install-banner').style.display='none';});
window.addEventListener('appinstalled',()=>{document.getElementById('install-banner').style.display='none';});

// inject icon
document.getElementById('install-icon').src=GYMICON;
// -- INIT --
render();
</script>
</body>
</html>
